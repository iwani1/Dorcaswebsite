<!-- Customer feedback section.
     Paystack asked for "customer feedback" as one of the sections a reviewed
     business should carry. Two parts:

       1. WooCommerce → Settings → Products → Enable product reviews. That gives a
          real, verifiable review on each product page.
       2. This section, for quotes you have actually received.

     DO NOT publish invented testimonials. A reviewer who finds fabricated reviews
     treats it as a trust problem, and so does a customer. Publish this empty (it
     renders nothing) until you have at least two real quotes with permission.

     Replace each block between the markers with a real quote. Delete any you do not
     have. When every block is deleted, the section hides itself. -->

<div class="qd-reviews">
	<style>
		.qd-reviews { max-width: 1290px; margin: 0 auto; padding: 76px 24px; }
		.qd-reviews__eyebrow {
			margin: 0 0 10px; font-size: 12px; letter-spacing: .2em;
			text-transform: uppercase; color: #8F6B28;
		}
		.qd-reviews__title { margin: 0 0 36px; font-size: clamp(26px, 3vw, 38px); line-height: 1.2; color: #0B4B4C; }
		.qd-reviews__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
		.qd-reviews__card {
			padding: 28px 26px; border: 1px solid #E6E1D5; background: #FAF8F5;
			display: flex; flex-direction: column; gap: 14px;
		}
		.qd-reviews__quote { margin: 0; font-size: 16px; line-height: 1.7; color: #3F4A49; }
		.qd-reviews__who { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #8F6B28; }
		.qd-reviews__stars { color: #C8AC77; letter-spacing: 3px; font-size: 14px; }
		@media (max-width: 980px) { .qd-reviews__grid { grid-template-columns: 1fr 1fr; } }
		@media (max-width: 620px) { .qd-reviews { padding: 48px 18px; } .qd-reviews__grid { grid-template-columns: 1fr; } }
	</style>

	<p class="qd-reviews__eyebrow">What people say</p>
	<h2 class="qd-reviews__title">Bought, worn, written about</h2>

	<div class="qd-reviews__grid">

		<!-- REVIEW 1 -->
		<figure class="qd-reviews__card">
			<div class="qd-reviews__stars" aria-label="Five out of five">★★★★★</div>
			<blockquote class="qd-reviews__quote">[The customer's own words, in their own words. One or two sentences is more convincing than a paragraph — and do not tidy it into marketing language.]</blockquote>
			<figcaption class="qd-reviews__who">[First name], [Area], Accra</figcaption>
		</figure>
		<!-- /REVIEW 1 -->

		<!-- REVIEW 2 -->
		<figure class="qd-reviews__card">
			<div class="qd-reviews__stars" aria-label="Five out of five">★★★★★</div>
			<blockquote class="qd-reviews__quote">[Second quote. A gift order works well here — it shows the piece arriving as a present.]</blockquote>
			<figcaption class="qd-reviews__who">[First name], [Town]</figcaption>
		</figure>
		<!-- /REVIEW 2 -->

		<!-- REVIEW 3 -->
		<figure class="qd-reviews__card">
			<div class="qd-reviews__stars" aria-label="Five out of five">★★★★★</div>
			<blockquote class="qd-reviews__quote">[Third quote. If any are from a stockist rather than a customer, say so — wholesale credibility reads differently.]</blockquote>
			<figcaption class="qd-reviews__who">[Shop name], [Town] — trade customer</figcaption>
		</figure>
		<!-- /REVIEW 3 -->

	</div>
</div>

<!-- Ask for reviews honestly: a card in every parcel with "if you have a minute,
     leave a review at queendorfashionhouse.com/reviews" is how the page fills up.
     Ask permission before quoting someone in this section. -->
